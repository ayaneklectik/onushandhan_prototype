<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin | অনুসন্ধান</title>
    <link rel="icon" type="image/jpeg" href="/favicon.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin.css?v=20261124-editor-fix-2" />
    <script src="/admin.js?v=20261124-editor-fix-2" defer></script>
  </head>
  <body class="admin-body">
    <header class="admin-topbar">
      <a class="admin-brand" href="/">
        <img src="/onusondhan-logo.png" alt="অনুসন্ধান" />
        <span>Administration</span>
      </a>
      <div id="account-bar" class="account-bar" hidden>
        <a href="/">View website</a>
        <span id="account-name"></span>
        <button id="logout-button" class="button button-quiet" type="button">Sign out</button>
      </div>
    </header>

    <main>
      <section id="login-panel" class="login-panel" aria-labelledby="login-title">
        <img src="/onusondhan-logo.png" alt="" />
        <p class="eyebrow">SECURE CONTENT MANAGEMENT</p>
        <h1 id="login-title">Sign in to your newsroom</h1>
        <form id="login-form" class="stack-form">
          <label>
            Username or email
            <input name="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="button button-primary" type="submit">Sign in</button>
          <p id="login-error" class="form-error" role="alert"></p>
        </form>
      </section>

      <section id="admin-app" class="admin-shell" hidden>
        <aside class="admin-sidebar">
          <p class="sidebar-label">WORKSPACE</p>
          <nav id="admin-nav" aria-label="Administration sections"></nav>
          <div class="sidebar-bottom">
            <a href="index.html">← Open public website</a>
          </div>
        </aside>
        <section class="admin-main">
          <div id="page-content"></div>
        </section>
      </section>
    </main>

    <dialog id="modal" class="modal">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="icon-button" type="button" aria-label="Close dialog">×</button>
      </div>
      <div id="modal-content" class="modal-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
